[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-iicpilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.122.0",
    "textual>=0.60",
]

[project.scripts]
iicpilot = "adaptive_iicpilot.__main__:main"

[tool.setuptools.packages.find]
include = ["adaptive_iicpilot*"]
